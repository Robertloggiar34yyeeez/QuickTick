name: Native iOS build and IPA
on:
  push:
    branches-ignore: ['ipa-uploaded/**']
    paths-ignore: ['.github/workflows/keep-three-builds.yml']
  pull_request:
  workflow_dispatch:
concurrency:
  group: quicktick-ios-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    # Mirage's native sdcpp XCFramework ships arm64 device/simulator slices.
    # The Intel runner cannot link its x86_64 simulator tests.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.3 toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
      - name: Verify Mirage-compatible Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
      - uses: actions/cache/restore@v5
        id: mirage-lora-cache
        with:
          path: ios-starter/MirageRuntime/Frameworks/sdcpp.xcframework
          key: mirage-lora-ios-arm64-${{ hashFiles('scripts/build-mirage-lora.sh', 'scripts/mirage-lora-native.patch') }}
      - name: Build native Mirage with LoRA support
        if: steps.mirage-lora-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ninja >/dev/null; then brew install ninja; fi
          bash scripts/build-mirage-lora.sh
      - uses: actions/cache/save@v5
        if: steps.mirage-lora-cache.outputs.cache-hit != 'true'
        with:
          path: ios-starter/MirageRuntime/Frameworks/sdcpp.xcframework
          key: mirage-lora-ios-arm64-${{ hashFiles('scripts/build-mirage-lora.sh', 'scripts/mirage-lora-native.patch') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: bge-micro-3edf6d7-v1
      - uses: actions/cache/restore@v5
        id: semantic-model-cache
        with:
          path: ios-starter/QuicktickNative/SemanticAssets
          key: bge-coreml-macos15-arm64-${{ hashFiles('scripts/prepare-semantic-model.py') }}
      - name: Prepare pinned on-device embedding model
        if: steps.semantic-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 2.2.2 is the last PyTorch release with Intel macOS wheels.
          python -m pip install 'torch==2.2.2' 'transformers==4.46.3' 'coremltools==8.3.0' 'numpy==1.26.4'
          python scripts/prepare-semantic-model.py
      - uses: actions/cache/save@v5
        if: steps.semantic-model-cache.outputs.cache-hit != 'true'
        with:
          path: ios-starter/QuicktickNative/SemanticAssets
          key: bge-coreml-macos15-arm64-${{ hashFiles('scripts/prepare-semantic-model.py') }}
      - name: Prepare pinned offline artist and character taxonomy
        run: python scripts/prepare-visual-taxonomy.py
      - uses: actions/cache/restore@v5
        id: wd-cache
        with:
          path: |
            ios-starter/QuicktickNative/SemanticAssets/WDTaggerV3.mlmodelc
            ios-starter/QuicktickNative/SemanticAssets/wd-v3-labels.json
            ios-starter/QuicktickNative/SemanticAssets/wd-v3-model-card.md
          key: wd-vit-v3-7f6b584-fp16-coreml8.3-arm64-v5
      - name: Prepare pinned anime-only WD Tagger v3
        if: steps.wd-cache.outputs.cache-hit != 'true'
        id: wd-model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'torch==2.2.2' 'torchvision==0.17.2' 'timm==1.0.12' 'transformers==4.46.3' 'coremltools==8.3.0' 'numpy==1.26.4'
          python scripts/prepare-wd-tagger.py
      - uses: actions/cache/save@v5
        if: steps.wd-cache.outputs.cache-hit != 'true' && steps.wd-model.outcome == 'success'
        with:
          path: |
            ios-starter/QuicktickNative/SemanticAssets/WDTaggerV3.mlmodelc
            ios-starter/QuicktickNative/SemanticAssets/wd-v3-labels.json
            ios-starter/QuicktickNative/SemanticAssets/wd-v3-model-card.md
          key: wd-vit-v3-7f6b584-fp16-coreml8.3-arm64-v5
      - name: Resolve Swift packages with clean-checkout retries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          # GitHub's shared SwiftPM checkout can occasionally be only partially
          # initialized ("fatal: not a git repository"). Each retry uses a new
          # checkout root and bypasses the potentially damaged repository cache.
          resolved=0
          for attempt in 1 2 3; do
            packages="$RUNNER_TEMP/quicktick-swiftpm-$attempt"
            echo "Resolving Swift packages (attempt $attempt of 3)"
            if xcodebuild -resolvePackageDependencies \
                -project ios-starter/QuicktickNative.xcodeproj \
                -scheme QuicktickNative \
                -clonedSourcePackagesDirPath "$packages" \
                -disablePackageRepositoryCache > "logs/xcodebuild-swiftpm-$attempt.txt" 2>&1; then
              echo "QUICKTICK_SPM_DIR=$packages" >> "$GITHUB_ENV"
              resolved=1
              break
            fi
            tail -n 50 "logs/xcodebuild-swiftpm-$attempt.txt"
            if [ "$attempt" -lt 3 ]; then sleep 8; fi
          done
          if [ "$resolved" -ne 1 ]; then
            echo "::error::Swift package resolution failed after three isolated attempts"
            exit 1
          fi
      - name: Archive real iPhone build without signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -project ios-starter/QuicktickNative.xcodeproj -scheme QuicktickNative -configuration Release -destination 'generic/platform=iOS' -archivePath build/QuicktickNative.xcarchive -clonedSourcePackagesDirPath "$QUICKTICK_SPM_DIR" -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES archive | tee logs/xcodebuild-archive.txt
      - name: Package unsigned IPA from verified Xcode archive
        id: ipa-package
        shell: bash
        run: bash scripts/package-archive-ipa.sh
      - uses: actions/upload-artifact@v6
        with:
          name: QuickTick-1.0-unsigned-IPA
          path: build/export/
          if-no-files-found: error
          retention-days: 14
      - name: Build and test native iOS app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          xcodebuild -version | tee logs/xcode-version.txt
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          boot_clean_iphone() {
            xcrun simctl shutdown "$DEVICE" || true
            xcrun simctl erase "$DEVICE"
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
          }
          run_iphone_tests() {
            local bundle="$1" log="$2"
            shift 2
            xcodebuild -project ios-starter/QuicktickNative.xcodeproj -scheme QuicktickNative -destination "platform=iOS Simulator,id=$DEVICE" -clonedSourcePackagesDirPath "$QUICKTICK_SPM_DIR" -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual -parallel-testing-enabled NO "$@" -resultBundlePath "logs/$bundle.xcresult" test | tee "logs/$log.txt"
          }
          failures=0
          boot_clean_iphone
          run_iphone_tests QuicktickUnitTests xcodebuild-unit-test -only-testing:QuicktickNativeTests || failures=1
          # XCTest's accessibility service can become unresponsive after a long
          # series of UI cases. Run the sensitive end-to-end scenarios with
          # fresh simulator state; do not skip or relax their assertions.
          boot_clean_iphone
          if ! run_iphone_tests QuicktickOnboardingTests xcodebuild-onboarding-test -only-testing:QuicktickNativeUITests/NavigationTests/testFirstRunWizardExplainsFeaturesAndCanSkipRule34Key; then
            # CoreSimulator occasionally cannot acquire the runner's launch
            # assertion before executing a single XCTest. Retry this one
            # infrastructure-only failure on a freshly erased simulator.
            if grep -q 'Timed out while acquiring background assertion' logs/xcodebuild-onboarding-test.txt; then
              echo '::warning::Simulator launch assertion timed out; retrying the full onboarding test once'
              boot_clean_iphone
              run_iphone_tests QuicktickOnboardingRetryTests xcodebuild-onboarding-retry-test -only-testing:QuicktickNativeUITests/NavigationTests/testFirstRunWizardExplainsFeaturesAndCanSkipRule34Key || failures=1
            else
              failures=1
            fi
          fi
          boot_clean_iphone
          run_iphone_tests QuicktickPreferencesTests xcodebuild-preferences-test -only-testing:QuicktickNativeUITests/NavigationTests/testPersonalPreferencesAndTabRefresh || failures=1
          boot_clean_iphone
          run_iphone_tests QuicktickImmersiveTests xcodebuild-immersive-test -only-testing:QuicktickNativeUITests/NavigationTests/testImmersiveRailSnapsAndDoubleTapLikes || failures=1
          boot_clean_iphone
          run_iphone_tests QuicktickTests xcodebuild-test -only-testing:QuicktickNativeUITests -skip-testing:QuicktickNativeUITests/NavigationTests/testFirstRunWizardExplainsFeaturesAndCanSkipRule34Key -skip-testing:QuicktickNativeUITests/NavigationTests/testPersonalPreferencesAndTabRefresh -skip-testing:QuicktickNativeUITests/NavigationTests/testImmersiveRailSnapsAndDoubleTapLikes || failures=1
          exit "$failures"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: iphone-test-log
          path: |
            logs/xcodebuild-*.txt
          retention-days: 14
      - name: Check native iPad layouts and playback
        if: ${{ !cancelled() && steps.ipa-package.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl shutdown all || true
          IPAD=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPad" in x["name"]))')
          xcrun simctl boot "$IPAD" || true
          xcrun simctl bootstatus "$IPAD" -b
          run_ipad_tests() {
            xcodebuild -project ios-starter/QuicktickNative.xcodeproj -scheme QuicktickNative -destination "platform=iOS Simulator,id=$IPAD" -clonedSourcePackagesDirPath "$QUICKTICK_SPM_DIR" -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual -parallel-testing-enabled NO -only-testing:QuicktickNativeUITests/NavigationTests/testAdaptiveMediaAcrossOrientationsAndForeground -only-testing:QuicktickNativeUITests/NavigationTests/testHomeInlinePlaybackAndComicClose -only-testing:QuicktickNativeUITests/NavigationTests/testImmersiveIPadCanvasAndSideNavigation -only-testing:QuicktickNativeUITests/NavigationTests/testSearchAppearsOnceBeforeAndAfterSubmitting -only-testing:QuicktickNativeUITests/NavigationTests/testDownloadedImagesUseNormalFeedAndCloseFullComic -resultBundlePath "logs/$1.xcresult" test | tee "logs/$2"
          }
          if ! run_ipad_tests QuicktickIPadTests xcodebuild-ipad-test.txt; then
            # The previous run aborted inside Apple's AX symbol-localization
            # snapshot with a damaged simulator malloc arena. Retry this
            # *whole* suite once only for a lost simulator connection; keep
            # real assertion failures red and preserve both sets of logs.
            if ! grep -q 'Lost connection to the application' logs/xcodebuild-ipad-test.txt; then
              exit 1
            fi
            echo '::warning::iPad accessibility connection crashed; retrying once on a clean simulator'
            xcrun simctl shutdown "$IPAD" || true
            xcrun simctl erase "$IPAD"
            xcrun simctl boot "$IPAD"
            xcrun simctl bootstatus "$IPAD" -b
            run_ipad_tests QuicktickIPadRetryTests xcodebuild-ipad-retry-test.txt
          fi
      - name: Export UI screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p logs/screenshots logs/diagnostics
          for suite in QuicktickOnboardingTests QuicktickPreferencesTests QuicktickImmersiveTests QuicktickTests QuicktickIPadTests QuicktickIPadRetryTests; do
            if [ -d "logs/$suite.xcresult" ]; then
              xcrun xcresulttool export attachments --path "logs/$suite.xcresult" --output-path "logs/screenshots/$suite" || true
              xcrun xcresulttool export diagnostics --path "logs/$suite.xcresult" --output-path "logs/diagnostics/$suite" || true
            fi
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-test-results
          path: |
            logs/*.txt
            logs/*.json
            logs/screenshots/
            logs/ipad-screenshots/
            logs/diagnostics/
          retention-days: 14
