name: QuicktickNative
options:
  bundleIdPrefix: com.quicktick
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 29
    MARKETING_VERSION: 0.9.9
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_QUICKTICK_API_BASE_URL: "$(QUICKTICK_API_BASE_URL)"
packages:
  ml-stable-diffusion:
    url: https://github.com/apple-aiml-research/ml-stable-diffusion.git
    exactVersion: 1.1.1
  QuicktickMirageRuntime:
    path: MirageRuntime
  DrawThings:
    url: https://github.com/drawthingsai/draw-things-community.git
    revision: 0621d8198f3ed505bb7cefc71b84f8f0e1ce5936
targets:
  QuicktickNative:
    type: application
    platform: iOS
    sources:
      - QuicktickNative
    dependencies:
      - package: ml-stable-diffusion
        product: StableDiffusion
      - package: QuicktickMirageRuntime
        product: Mirage
      - package: DrawThings
        product: _MediaGenerationKit
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Simulator.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/iPhone.entitlements
  QuicktickNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - QuicktickNativeTests
    dependencies:
      - target: QuicktickNative
  QuicktickNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - QuicktickNativeUITests
    dependencies:
      - target: QuicktickNative
