name: Quicktick
options:
  bundleIdPrefix: app.quicktick
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Quicktick:
    type: application
    platform: iOS
    sources: [Quicktick]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.quicktick.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quicktick
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
  QuicktickTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuicktickTests]
    dependencies: [Quicktick]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Quicktick:
    build:
      targets:
        Quicktick: all
    test:
      targets:
        - QuicktickTests
